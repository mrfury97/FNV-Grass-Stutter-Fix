; Grass Stutter Fix - every switch is explained in README.md
[Main]
bKeepOffscreen=1
bSkipTurnOnly=1
bMemoEmpty=1
; CreateGrass calls per frame for patches farther than fNearRadius during camera updates (0 = no limit)
iBudget=150
fNearRadius=3000
bLog=1
; log every camera grass update slower than this
fSlowMs=8
